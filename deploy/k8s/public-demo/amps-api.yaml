# Public demo backend (amps.binihost.com/api) — captured from live 2026-11-15.
# Admin login comes from secret amps-demo-admin (created out of band, never in git).
# Synthetic network reseeded on every start (AMPS_SEED=network). Undo: kubectl -n amps-demo rollout undo deploy/amps-api
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    app: amps-api
    app.kubernetes.io/part-of: amps-demo
  name: amps-api
  namespace: amps-demo
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: amps-api
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: amps-api
        app.kubernetes.io/part-of: amps-demo
    spec:
      containers:
      - env:
        - name: AMPS_SEED_ON_START
          value: '1'
        - name: AMPS_CORS_ORIGINS
          value: https://amps.binihost.com
        - name: AMPS_SEED
          value: network
        - name: AMPS_ORG
          value: Demo Industries Group
        - name: AMPS_STANDARD_LINE
          value: Metro Traction & Depot
        - name: AMPS_AUTH
          value: '1'
        - name: AMPS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: AMPS_ADMIN_PASSWORD
              name: amps-demo-admin
        - name: AMPS_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: AMPS_ADMIN_USER
              name: amps-demo-admin
        # Ask AMPS: Gemini first, cluster Ollama when Gemini errors or is rate-limited.
        # Key: secret amps-demo-ai/GEMINI_API_KEY, loaded from bvault imagegen/GEMINI_API_KEY.
        - name: AMPS_AI_PROVIDER
          value: gemini
        - name: AMPS_GEMINI_MODEL
          value: gemini-2.5-flash
        - name: AMPS_GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              key: GEMINI_API_KEY
              name: amps-demo-ai
        - name: AMPS_AI_FALLBACK_URL
          value: http://ollama.bini-ai.svc:11434/v1
        - name: AMPS_AI_FALLBACK_MODEL
          value: qwen2.5:3b
        - name: AMPS_AI_PER_MINUTE
          value: '6'
        - name: AMPS_AI_PER_DAY
          value: '400'
        image: ghcr.io/biniyognet/amps-backend:oc11190020-autoplan
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: api
        ports:
        - containerPort: 8000
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 15m
            memory: 96Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: binihost-registry-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30


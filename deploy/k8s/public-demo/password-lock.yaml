# Public demo: the shared admin / admin login must not be changeable by visitors.
# Traefik answers 403 on the two password routes before they reach amps-api, so
# no API roll (and no reseed) is needed. Remove this file's objects to unlock.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: amps-password-lock
  namespace: amps-demo
spec:
  ipAllowList:
    sourceRange: ["127.0.0.1/32"]   # nobody outside the pod's loopback = 403
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: amps-api-password-lock
  namespace: amps-demo
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`amps-api.binihost.com`) && (Path(`/api/auth/change-password`) || PathRegexp(`^/api/auth/users/[^/]+/reset-password$`))
    priority: 1000
    middlewares:
    - name: amps-password-lock
    services:
    - name: amps-api
      port: 8000
  tls:
    secretName: amps-api-tls

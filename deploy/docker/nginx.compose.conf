# Compose variant of nginx.conf — no Ingress layer here, so nginx itself
# proxies the backend routes to keep the app same-origin.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # static JS/CSS/SVG compressed here; the API gzips its own JSON
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # live event stream: websocket upgrade, long read timeout (server pings every 25 s)
    location = /api/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # hashed build assets (index-<hash>.js/.css) are immutable — cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NEVER be cached, or a new deploy leaves browsers pointing
    # at a deleted JS bundle (the whole app then fails to load). Always revalidate.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri /index.html;
    }

    location ~ ^/(api|docs|openapi.json|redoc) {
        client_max_body_size 32m;  # bulk CSV imports (register / logbook history)
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# AMPS public-demo look on one machine — same build and data as amps.binihost.com:
# live screens + neutral brand, Demo Industries Group network seed (44 sites/stations,
# 1,874 assets, 14k logbook rows). One project, `amps-buildathon` (volumes
# amps-buildathon_pgdata/_media, port 8081), so it never clashes with an `amps` stack
# and the command below always reuses the same stack instead of starting a second one.
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.demo.yaml up -d --build
#   → http://localhost:8081   (login admin / admin)
#
# Fresh data: add `down -v` first (seed.py only seeds an empty database).
name: amps-buildathon

services:
  backend:
    environment:
      AMPS_SEED_ON_START: "1"
      AMPS_SEED: network
      AMPS_ORG: Demo Industries Group
      AMPS_STANDARD_LINE: Metro Traction & Depot
      AMPS_AUTH: "1"
      # Gemini (Snap & Report, Ask AMPS, auto-plan): the key goes in deploy/.env
      # (git-ignored) as AMPS_GEMINI_API_KEY=…; without it the AI features stay off.
      AMPS_AI_PROVIDER: ${AMPS_AI_PROVIDER:-gemini}
      AMPS_GEMINI_API_KEY: ${AMPS_GEMINI_API_KEY:-}
      AMPS_GEMINI_MODEL: ${AMPS_GEMINI_MODEL:-gemini-3.5-flash-lite}

  frontend:
    build:
      args:
        AMPS_DATA: live
        AMPS_BRAND: neutral
    ports: !override
      - "8081:80"

# AMPS public-demo look on one machine — same build and data as amps.binihost.com:
# live screens + neutral brand, Demo Industries Group network seed (44 sites/stations,
# 1,874 assets, 14k logbook rows). Own project name, volume and port, so an existing
# `amps` stack and its data are left alone.
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.demo.yaml up -d --build
#   → http://localhost:8081   (login admin / admin)
#
# Fresh data: add `down -v` first (seed.py only seeds an empty database).
name: amps-demo

services:
  backend:
    environment:
      AMPS_SEED_ON_START: "1"
      AMPS_SEED: network
      AMPS_ORG: Demo Industries Group
      AMPS_STANDARD_LINE: Metro Traction & Depot
      AMPS_AUTH: "1"

  frontend:
    build:
      args:
        AMPS_DATA: live
        AMPS_BRAND: neutral
    ports: !override
      - "8081:80"

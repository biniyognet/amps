# AMPS — one-command local/operational deployment (office laptop, workstation).
#
#   docker compose -f deploy/compose.yaml up -d --build
#   → http://localhost:8080  (UI; /api, /docs proxied same-origin)
#
# Data is REAL and persistent (Postgres volume). To load the synthetic demo
# dataset into an empty database:
#   docker compose -f deploy/compose.yaml run --rm backend python seed.py
#
# The k8s/ directory remains the public-demo hosting path; this file is the
# zero-cluster equivalent for a single machine.
name: amps

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amps
      POSTGRES_USER: amps
      POSTGRES_PASSWORD: amps          # local single-machine default — change if exposed
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amps -d amps"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://amps:amps@db/amps
      # Login (operational deployments): AMPS_AUTH=1 turns it on — reads stay
      # open (QR/walk-up viewing), writes need a signed-in, line-scoped user.
      AMPS_AUTH: ${AMPS_AUTH:-0}
      AMPS_SECRET: ${AMPS_SECRET:-}            # set to keep sessions across restarts
      AMPS_ADMIN_PASSWORD: ${AMPS_ADMIN_PASSWORD:-admin}  # first-boot admin
      AMPS_MEDIA_DIR: /app/media
      # Split server: slow work (reindex, BigQuery export, ampsTalk breach
      # fan-out) queues here for the worker instead of blocking a request.
      AMPS_REDIS_URL: redis://redis:6379/0
    volumes:
      - media:/app/media          # checksheet scans/photos/PDFs (backed up off-box)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    # job queue + event pub/sub only — nothing here needs to survive a restart
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg2://amps:amps@db/amps
      AMPS_AUTH: ${AMPS_AUTH:-0}
      AMPS_SECRET: ${AMPS_SECRET:-}
      AMPS_ADMIN_PASSWORD: ${AMPS_ADMIN_PASSWORD:-admin}
      AMPS_MEDIA_DIR: /app/media
      AMPS_REDIS_URL: redis://redis:6379/0
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        AMPS_DATA: ${AMPS_DATA:-demo}   # live = screens read the backend, no demo dataset
        AMPS_ORG: ${AMPS_ORG:-}         # organisation name on headers/tags/printouts
        AMPS_ORDER_REF: ${AMPS_ORDER_REF:-}          # operator details: office env only
        AMPS_ORDER_EXTRACT: ${AMPS_ORDER_EXTRACT:-}
        AMPS_ORG_ALIASES: ${AMPS_ORG_ALIASES:-}
        AMPS_PILOT_URL: ${AMPS_PILOT_URL:-}          # live pilot link in the menu; unset = hidden
    volumes:
      - ./docker/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media:

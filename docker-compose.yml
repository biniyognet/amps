services:
  db:
    image: pgvector/pgvector:pg16   # Postgres 16 + pgvector: "Seen before" ranks in the DB
    environment:
      POSTGRES_DB: amps
      POSTGRES_USER: amps
      POSTGRES_PASSWORD: amps_dev_only   # change for any real deployment
    ports:
      - "5432:5432"
    volumes:
      - amps_pgdata:/var/lib/postgresql/data

volumes:
  amps_pgdata:
